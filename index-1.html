<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1423">
    <title>Biodata Siswa dan Guru</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wadah">
        <header>
            <div>
                <h1>Teknik Komputer Jaringan</h1>
                <p>Cari berdasarkan role</p>
            </div>
            <button type="button" class="btn-tambah" id="btnTambah">+ Tambah Data</button>
        </header>

        <div class="kontrol">
            <input id="cari" type="search"
                   placeholder="Cari nama, NIS, atau NIP"
                   aria-label="Cari nama, NIS, atau NIP">

            <select id="filterGuru" aria-label="Filter guru">
                <option value="">Semua Guru</option>
            </select>

            <select id="filterKelas" aria-label="Filter kelas">
                <option value="">Semua Kelas</option>
            </select>
        </div>

        <p id="jumlah" class="jumlah" aria-live="polite"></p>

        <section class="guru-section" aria-labelledby="guruJudul">
            <div class="bagian-header">
                <h2 id="guruJudul">Data Guru</h2>
                <button type="button" class="btn-tambah" id="btnTambahGuru">+ Tambah Guru</button>
            </div>
            <main id="daftarGuru" class="daftar-guru" aria-live="polite"></main>
        </section>

        <section class="siswa-section" aria-labelledby="siswaJudul">
            <div class="bagian-header">
                <h2 id="siswaJudul">Data Siswa</h2>
            </div>
            <main id="daftar" class="daftar" aria-live="polite"></main>
        </section>
    </div>

    <!-- Modal data guru -->
    <div id="modalGuru" class="modal">
        <section class="modal-konten" role="dialog" aria-modal="true" aria-labelledby="modalGuruJudul">
            <h2 id="modalGuruJudul">Tambah Data Guru</h2>
            <form id="formGuru">
                <input type="hidden" id="guruId">

                <div class="form-grup">
                    <label for="guruNama">Nama *</label>
                    <input id="guruNama" type="text" required maxlength="150">
                </div>

                <div class="form-grup">
                    <label for="guruMapel">Mata Pelajaran *</label>
                    <input id="guruMapel" type="text" required maxlength="150">
                </div>

                <div class="form-grup">
                    <label for="guruGender">Gender *</label>
                    <select id="guruGender" required>
                        <option value="">-- Pilih --</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="guruAlamat">Alamat</label>
                    <input id="guruAlamat" type="text" maxlength="250">
                </div>

                <div class="form-grup">
                    <label for="guruEmail">Alamat Email *</label>
                    <input id="guruEmail" type="email" required maxlength="254">
                </div>

                <div class="form-grup">
                    <label for="guruJurusan">Jurusan *</label>
                    <select id="guruJurusan" required>
                        <option value="">-- Pilih jurusan --</option>
                        <option value="TKJ">TKJ (Teknik Komputer dan Jaringan)</option>
                        <option value="TKR">TKR (Teknik Kendaraan Ringan)</option>
                    </select>
                </div>

                <div class="modal-tombol">
                    <button type="button" class="btn-batal" id="btnBatalGuru">Batal</button>
                    <button type="submit" class="btn-simpan" id="btnSimpanGuru">Simpan Guru</button>
                </div>
            </form>
        </section>
    </div>

    <!-- Modal data siswa -->
    <div id="modalSiswa" class="modal">
        <section class="modal-konten" role="dialog" aria-modal="true" aria-labelledby="modalJudul">
            <h2 id="modalJudul">Tambah Data Siswa</h2>
            <form id="formSiswa">
                <input type="hidden" id="formAction" value="INSERT">
                <input type="hidden" id="originalNis">

                <div class="form-grup">
                    <label for="inputNis">NIS *</label>
                    <input id="inputNis" type="text" required maxlength="30" placeholder="Contoh: 20261001">
                </div>

                <div class="form-grup">
                    <label for="inputNama">Nama Lengkap *</label>
                    <input id="inputNama" type="text" required maxlength="150" placeholder="Nama lengkap siswa">
                </div>

                <div class="form-grup">
                    <label for="inputKelas">Kelas</label>
                    <input id="inputKelas" type="text" maxlength="50" placeholder="Contoh: XI-TKJ-1">
                </div>

                <div class="form-grup">
                    <label for="inputGender">Jenis Kelamin</label>
                    <select id="inputGender">
                        <option value="">-- Pilih --</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="inputLahir">Tanggal Lahir</label>
                    <input id="inputLahir" type="date">
                </div>

                <div class="form-grup">
                    <label for="inputAlamat">Alamat</label>
                    <input id="inputAlamat" type="text" maxlength="500" placeholder="Nama jalan, kota">
                </div>

                <div class="form-grup">
                    <label for="inputFoto">URL Foto (Opsional)</label>
                    <input id="inputFoto" type="url" placeholder="https://contoh.com/foto.jpg">
                </div>

                <div class="modal-tombol">
                    <button type="button" class="btn-batal" id="btnBatal">Batal</button>
                    <button type="submit" class="btn-simpan" id="btnSimpan">Simpan Data</button>
                </div>
            </form>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
