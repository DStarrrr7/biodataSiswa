
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biodata Siswa dan Guru</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f7eef3;
            --kartu: #ffffff;
            --teks: #14213d;
            --redup: #5b667a;
            --garis: #d6dde8;
            --aksen: #1d4ed8;
            --hapus: #dc2626;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1e1b29;
                --kartu: #2d263a;
                --teks: #ffffff;
                --redup: #b3a9c9;
                --garis: #443b59;
                --aksen: #6c9bff;
                --hapus: #f87171;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--teks);
            font-family: "Plus Jakarta Sans", sans-serif;
            line-height: 1.5;
        }

        button, input, select { font: inherit; }

        button { cursor: pointer; }

        .wadah {
            max-width: 1100px;
            margin: auto;
            padding: 24px 16px 48px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 { margin: 0 0 4px; font-size: 1.75rem; }
        header p { margin: 0; color: var(--redup); }

        .btn-tambah, .btn-simpan {
            background: var(--aksen);
            color: white;
            border: 0;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 600;
        }

        .kontrol {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0 8px;
        }

        .kontrol input, .kontrol select,
        .form-grup input, .form-grup select {
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid var(--garis);
            border-radius: 9px;
            background: var(--kartu);
            color: var(--teks);
        }

        .kontrol input { flex: 1 1 220px; }
        .kontrol select { flex: 0 1 180px; }
        .jumlah { color: var(--redup); font-size: .9rem; }

        .guru-section { margin: 28px 0; }
        .bagian-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .bagian-header h2 { margin: 0; font-size: 1.25rem; }
        .daftar-guru {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }
        .kartu-guru { padding: 18px; }
        .kartu-guru .nama { margin-bottom: 4px; }
        .kartu-guru .nis { margin-bottom: 12px; }

        .daftar {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .kartu {
            display: flex;
            flex-direction: column;
            background: var(--kartu);
            border: 1px solid var(--garis);
            border-radius: 14px;
            overflow: hidden;
        }

        .pita { height: 56px; }

        .isi {
            padding: 0 16px 16px;
            text-align: center;
            flex: 1;
        }

        .foto {
            width: 76px;
            height: 76px;
            margin: -38px auto 8px;
            border: 4px solid var(--kartu);
            border-radius: 50%;
            display: grid;
            place-items: center;
            overflow: hidden;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .foto img { width: 100%; height: 100%; object-fit: cover; }

        .nama { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
        .nis { margin: 0 0 12px; color: var(--redup); font-size: .85rem; }

        .rincian { margin: 0; text-align: left; font-size: .9rem; }
        .rincian div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 0;
            border-top: 1px solid var(--garis);
        }
        .rincian dt { color: var(--redup); }
        .rincian dd { margin: 0; font-weight: 600; text-align: right; overflow-wrap: anywhere; }

        .kartu-aksi { display: flex; border-top: 1px solid var(--garis); }
        .kartu-aksi button {
            flex: 1;
            padding: 10px;
            border: 0;
            background: transparent;
            font-size: .85rem;
            font-weight: 600;
        }
        .btn-edit { color: var(--aksen); }
        .btn-hapus { color: var(--hapus); border-left: 1px solid var(--garis) !important; }
        button:hover { opacity: .85; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            place-items: center;
            padding: 16px;
            background: rgba(0, 0, 0, .55);
        }

        .modal-konten {
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            border-radius: 14px;
            background: var(--kartu);
        }

        .modal-konten h2 { margin-top: 0; font-size: 1.3rem; }

        .form-grup {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 13px;
        }

        .form-grup label { font-size: .9rem; font-weight: 600; color: var(--redup); }
        .form-grup input, .form-grup select { width: 100%; }

        .modal-tombol {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-batal {
            padding: 9px 16px;
            border: 1px solid var(--garis);
            border-radius: 8px;
            background: transparent;
            color: var(--teks);
        }

        .pesan {
            grid-column: 1 / -1;
            padding: 32px 16px;
            text-align: center;
            color: var(--redup);
        }

        .pesan.galat { color: var(--hapus); }
        .btn-tambah:focus-visible, button:focus-visible,
        input:focus-visible, select:focus-visible {
            outline: 2px solid var(--aksen);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="wadah">
        <header>
            <div>
                <h1>Teknik Komputer dan Jaringan </h1>
                <p>Cari Siswa atau Guru Berdasarkan Nama</p>
            </div>
            <button type="button" class="btn-tambah" id="btnTambah">
                 Tambah Siswa
            </button>
        </header>

        <div class="kontrol">
            <input id="cari" type="search"
                   placeholder="Cari nama atau NIS"
                   aria-label="Cari nama atau NIS">
            <select id="filterKelas" aria-label="Filter kelas">
                <option value="">Pilih kelas</option>
            </select>
            <select id="filterGuru" aria-label="Pilih guru">
                <option value="">Pilih guru</option>
            </select>
        </div>

        <section class="guru-section" aria-labelledby="guruJudul">
            <div class="bagian-header">
                <h2 id="guruJudul">Data Guru</h2>
                <button type="button" class="btn-tambah" id="btnTambahGuru">
                    Tambah Guru
                </button>
            </div>
            <main id="daftarGuru" class="daftar-guru" aria-live="polite"></main>
        </section>

        <p id="jumlah" class="jumlah" aria-live="polite"></p>
        <main id="daftar" class="daftar" aria-live="polite"></main>
    </div>

    <div id="modalGuru" class="modal">
        <section class="modal-konten"
                 role="dialog" aria-modal="true"
                 aria-labelledby="modalGuruJudul">
            <h2 id="modalGuruJudul">Tambah Data Guru</h2>

            <form id="formGuru">
                <input type="hidden" id="guruId">

                <div class="form-grup">
                    <label for="guruNama">Nama *</label>
                    <input id="guruNama" type="text" required maxlength="150">
                </div>

                <div class="form-grup">
                    <label for="guruMapel">Mata Pelajaran *</label>
                    <input id="guruMapel" type="text" required maxlength="150">
                </div>

                <div class="form-grup">
                    <label for="guruGender">Gender *</label>
                    <select id="guruGender" required>
                        <option value="">-- Pilih --</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="guruAlamat">Alamat</label>
                    <input id="guruAlamat" type="text" maxlength="250">
                </div>

                <div class="form-grup">
                    <label for="guruEmail">Alamat Email *</label>
                    <input id="guruEmail" type="email" required maxlength="254">
                </div>

                <div class="form-grup">
                    <label for="guruJurusan">Jurusan *</label>
                    <select id="guruJurusan" required>
                        <option value="">-- Pilih jurusan --</option>
                        <option value="TKJ">TKJ (Teknik Komputer dan Jaringan)</option>
                        <option value="TKR">TKR (Teknik Kendaraan Ringan)</option>
                    </select>
                </div>

                <div class="modal-tombol">
                    <button type="button" class="btn-batal" id="btnBatalGuru">
                        Batal
                    </button>
                    <button type="submit" class="btn-simpan" id="btnSimpanGuru">
                        Simpan Guru
                    </button>
                </div>
            </form>
        </section>
    </div>

    <div id="modalSiswa" class="modal">
        <section class="modal-konten"
                 role="dialog" aria-modal="true"
                 aria-labelledby="modalJudul">
            <h2 id="modalJudul">Tambah Data Siswa</h2>

            <form id="formSiswa">
                <input type="hidden" id="formAction" value="INSERT">
                <input type="hidden" id="originalNis">

                <div class="form-grup">
                    <label for="inputNis">NIS *</label>
                    <input id="inputNis" type="text" required
                           maxlength="30" placeholder="Contoh: 20261001">
                </div>

                <div class="form-grup">
                    <label for="inputNama">Nama Lengkap *</label>
                    <input id="inputNama" type="text" required
                           maxlength="150" placeholder="Nama lengkap siswa">
                </div>

                <div class="form-grup">
                    <label for="inputKelas">Kelas</label>
                    <input id="inputKelas" type="text"
                           maxlength="50" placeholder="Contoh: XI-TKJ-1">
                </div>

                <div class="form-grup">
                    <label for="inputGender">Jenis Kelamin</label>
                    <select id="inputGender">
                        <option value="">-- Pilih --</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="inputLahir">Tanggal Lahir</label>
                    <input id="inputLahir" type="date">
                </div>

                <div class="form-grup">
                    <label for="inputAlamat">Alamat</label>
                    <input id="inputAlamat" type="text"
                           maxlength="500" placeholder="Nama jalan, kota">
                </div>

                <div class="form-grup">
                    <label for="inputFoto">URL Foto (Opsional)</label>
                    <input id="inputFoto" type="url"
                           placeholder="https://contoh.com/foto.jpg">
                </div>

                <div class="modal-tombol">
                    <button type="button" class="btn-batal" id="btnBatal">
                        Batal
                    </button>
                    <button type="submit" class="btn-simpan" id="btnSimpan">
                        Simpan Data
                    </button>
                </div>
            </form>
        </section>
    </div>

    <!-- Pustaka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Logika aplikasi -->
    <script src="script.js"></script>
</body>
</html>
